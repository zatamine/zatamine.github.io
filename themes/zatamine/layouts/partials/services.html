{{/* Partial: Services / What I Do */}}
{{/* 
  Displays the core service offerings in a grid layout.
  Expected context: Homepage context
*/}}
<section class="services-section container mt-16 mb-16">
  <h2 class="section-title mb-16">What I Do</h2>
  
  <div class="services-grid">
    {{ range .Site.Params.services }}
      <div class="service-card">
        <h3>{{ .icon }} {{ .title }}</h3>
        <p>{{ .description }}</p>
      </div>
    {{ end }}
  </div>
</section>
