<section class="section" id="services">
  <div class="container">
    <header class="section-head">
      <span class="kicker">// core services</span>
      <h2></h2>What I Do</h2>
    </header>

    <div class="service-grid">
      {{ range site.Data.services.services }}
        <article class="card service-card" id="{{ .id }}">
          <div class="service-top">
            <span class="service-icon">{{ .icon | safeHTML }}</span>
            <span class="service-num" aria-hidden="true">{{ .num }}</span>
          </div>
          <h3>{{ .title }}</h3>
          <p class="service-summary">{{ .summary }}</p>
          <ul class="service-points">
            {{ range .points }}
              <li>{{ . }}</li>
            {{ end }}
          </ul>
          <ul class="chips" aria-label="Technologies">
            {{ range .tech }}
              <li class="chip">{{ . }}</li>
            {{ end }}
          </ul>
        </article>
      {{ end }}
    </div>
  </div>
</section>
