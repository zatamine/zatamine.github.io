<section class="py-12 md:py-16">
    <div class="text-center mb-12">
        <h2 class="text-2xl md:text-3xl font-bold mb-4">What I Do</h2>
        <p class="text-gray-500 max-w-2xl mx-auto">
            Core services that help organizations build and maintain robust software systems
        </p>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
        {{ range .Site.Data.services }}
        <div class="bg-card border border-border rounded-lg p-6 transition-transform duration-300 hover:scale-[1.02]">
            <div class="flex items-start">
                <span class="text-2xl mr-4">{{ .icon }}</span>
                <div></div>
                    <h3 class="text-xl font-semibold mb-2">{{ .name }}</h3>
                    <p class="text-gray-300">{{ .description }}</p>
                </div>
            </div>
        </div>
        {{ end }}
    </div>
</section>
