<section></section>
  <h2 class="text-3xl font-bold mb-8 text-center">What I Do</h2>
  
  <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
    {{ range $.Site.Data.services }}
    <div class="bg-slate-800/50 border border-slate-700/50 rounded-xl p-6 hover:border-emerald-500/30 transition-colors">
      <h3 class="text-xl font-semibold mb-3">{{ .title }}</h3>
      <p class="text-slate-300 mb-4">{{ .description }}</p>
      <ul class="space-y-2">
        {{ range .focus_areas }}
        <li class="flex items-start gap-2 text-sm">
          <span class="mt-1.5 w-1.5 h-1.5 bg-emerald-400 rounded-full"></span>
          {{ . }}
        </li>
        {{ end }}
      </ul>
    </div>
    {{ end }}
  </div>
</section>
