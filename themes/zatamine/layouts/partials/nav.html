<header class="site-nav" id="top">
  <div class="container nav-inner">
    <a class="brand" href="{{ "/" | relURL }}" aria-label="{{ site.Title }} — home">zatamine<span class="cursor" aria-hidden="true"></span></a>

    <nav class="nav-links" id="primary-nav" aria-label="Primary navigation">
      {{ range site.Menus.main }}
        <a class="nav-link{{ if $.HasMenuCurrent "main" . }} is-active{{ end }}" href="{{ .URL | relLangURL }}">{{ .Name }}</a>
      {{ end }}
    </nav>

    <div class="nav-right">
      {{ with site.Data.status.badge }}
        <span class="availability">
          <span class="dot" aria-hidden="true"></span>
          <span class="label">{{ . }}</span>
        </span>
      {{ end }}
      <button class="menu-toggle" type="button" aria-label="Toggle navigation menu" aria-controls="primary-nav" aria-expanded="false">
        <span class="bar" aria-hidden="true"></span>
        <span class="bar" aria-hidden="true"></span>
        <span class="bar" aria-hidden="true"></span>
      </button>
    </div>
  </div>
</header>
