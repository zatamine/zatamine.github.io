{{- if or .Paginator.HasPrev .Paginator.HasNext }}
<nav class="pagination" aria-label="Pagination">
  {{- if .Paginator.HasPrev }}
  <a href="{{ .Paginator.Prev.URL }}" class="btn btn-ghost btn-sm">&larr; Newer</a>
  {{- end }}
  <span class="pagination-page">{{ .Paginator.PageNumber }} / {{ .Paginator.TotalPages }}</span>
  {{- if .Paginator.HasNext }}
  <a href="{{ .Paginator.Next.URL }}" class="btn btn-ghost btn-sm">Older &rarr;</a>
  {{- end }}
</nav>
{{- end }}
