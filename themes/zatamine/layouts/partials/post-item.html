<li>
  <a class="post-item" href="{{ .RelPermalink</li> }}">
    <time class="post-date" datetime="{{ .Date | time.Format "2006-01-02T15:04:05Z07:00" }}">{{ .Date | time.Format "January 2, 2006" }}</time>
    <span class="post-item-body">
      <span class="post-title">{{ .Title }}</span>
      {{ with .GetTerms "tags" }}
        <span class="chips post-tags">
          {{ range first 3 . }}<a class="chip" href="{{ .RelPermalink }}">{{ .LinkTitle }}</a>{{ end }}
        </span>
      {{ end }}
    </span>
    <span class="post-readtime">{{ .ReadingTime }} min read</span>
  </a>
</li>
