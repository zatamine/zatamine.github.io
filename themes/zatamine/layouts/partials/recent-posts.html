<section class="py-12 md:py-16">
    <div class="flex justify-between items-center mb-8">
        <h2 class="text-2xl md:text-3xl font-bold">Recent Articles</h2>
        <a href="/posts/" class="text-primary hover:underline">View all posts →</a>
    </div>
    
    <div class="grid grid-cols-1 md:grid-cols-3 gap-6">
        {{ $posts := first 3 (where .Site.RegularPages "Type" "posts") }}
        {{ range $posts }}
        <article class="bg-card border border-border rounded-lg p-6">
            <h3 class="text-lg font-semibold mb-2">
                <a href="{{ .RelPermalink }}" class="hover:text-primary transition-colors">
                    {{ .Title }}
                </a>
            </h3>
            <p class="text-gray-500 text-sm mb-3">{{ .Date.Format "January 2, 2006" }}</p>
            <p class="text-gray-300 text-sm mb-4">{{ .Summary }}</p>
            <div class="flex items-center justify-between">
                <span class="text-xs text-gray-500">{{ .ReadingTime }} min read</span>
                <div class="flex flex-wrap gap-1">
                    {{ range .Params.tags }}
                    <span class="px-2 py-1 bg-primary/10 rounded-full text-xs text-primary">
                        {{ . }}
                    </span>
                    {{ end }}
                </div>
            </div>
        </article>
        {{ end }}
    </div>
</section>
