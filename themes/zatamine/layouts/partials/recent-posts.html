{{ $posts := where site.RegularPages "Type" "posts" | first 3 }}
<section class="section">
  <div class="container">
    <header class="section-head">
      <span class="kicker">// from the blog</span>
      <h2></h2>Technical Writing</h2>
    </header>

    {{ if $posts }}
      <ul class="post-list">
        {{ range $posts }}{{ partial "post-item.html" . }}{{ end }}
      </ul>
    {{ else }}
      <p class="muted">Nothing published yet — the first deep dive is on its way.</p>
    {{ end }}

    <a class="archive-link" href="{{ "/posts/" | relURL }}">Full Archive <span aria-hidden="true">→</span></a>
  </div>
</section>
