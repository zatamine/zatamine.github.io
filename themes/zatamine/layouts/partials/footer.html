{{/* Partial: Footer */}}
{{/* 
  Site footer with copyright, RSS feed, and status indicator.
  Expected context: Any page context
*/}}
<footer class="footer container">
  <div class="copyright">
    © {{ now.Format "2006" }} Amine. All rights reserved.
  </div>
  
  <div class="rss-link">
    <a href="""/index.xml" class="social-link">RSS</a>
  </div>
  
  {{ if .Site.Params.uptime }}
    <div class="status-badge">⚡ {{ .Site.Params.uptime }}</div>
  {{ end }}
</footer>
