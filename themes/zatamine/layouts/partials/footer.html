<footer class="site-footer">
  <div class="container footer-inner">
    <p class="copyright">© {{ now.Year }} {{ site.Params.author }}</p>

    {{ with site.Data.status.status }}
      <span class="footer-status"><span class="dot" aria-hidden="true"></span>{{ . }}</span>
    {{ end }}

    <a class="footer-rss" href="{{ "/index.xml" | relURL }}" title="RSS feed">RSS</a>
  </div>
</footer>
