<footer class="site-footer">
  <div class="footer container">
    <p class="footer-copy">
      &copy; {{ now.Year }} {{ site.Params.author | default site.Title }}. All rights reserved.
    </p>
    <div class="footer-right">
      {{- with site.GetPage "/index.xml" }}
      <a href="{{ .RelPermalink }}" class="footer-link" aria-label="RSS feed">
        {{ partial "icons.html" (dict "name" "rss") }}
      </a>
      {{- end }}
      <span class="footer-status">
        <span class="status-dot status-dot-sm" aria-hidden="true"></span> Operational
      </span>
    </div>
  </div>
</footer>
