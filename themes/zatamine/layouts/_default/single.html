{{ define "main" }}
<div class="container mx-auto px-4 pt-12 pb-16">
    <article class="max-w-3xl mx-auto prose prose-invert prose-lg">
        <header class="mb-12">
            <h1 class="text-4xl font-bold">{{ .Title }}</h1>
            <div class="mt-4 flex items-center text-slate-400">
                <time>{{ .Date.Format "January 2, 2006" }}</time>
                <span class="mx-2">•</span>
                <span>{{ .ReadingTime }} min read</span>
            </div>
        </header>
        
        {{ .TableOfContents }}
        
        <div class="prose prose-invert max-w-none">
            {{ .Content }}
        </div>
        
        <footer class="mt-16 pt-8 border-t border-slate-800">
            <div class="flex flex-wrap gap-2 mb-6">
                {{ range .Params.tags }}
                <span class="text-sm bg-slate-800 px-3 py-1 rounded-full">{{ . }}</span>
                {{ end }}
            </div>
            
            <div class="flex items-center space-x-4">
                <img src="/avatar.jpg" alt="Amine" class="w-12 h-12 rounded-full">
                <div></div>
                    <h3 class="font-semibold">Amine</h3>
                    <p class="text-sm text-slate-500">Independent Software Engineer & SRE Consultant</p>
                </div>
            </div>
        </footer>
    </article>
</div>
{{ end }}
