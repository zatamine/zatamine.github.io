{{ define "main" }}
<div class="container mx-auto px-4 py-8 max-w-3xl">
    <article class="prose prose-invert">
        <header class="mb-8 pb-6 border-b border-border">
            <h1 class="text-3xl font-bold mb-2">{{ .Title }}</h1>
            <div class="flex items-center text-gray-500 text-sm mb-4">
                <time datetime="{{ .Date }}">{{ .Date.Format "January 2, 2006" }}</time>
                <span class="mx-2">•</span>
                <span>{{ .ReadingTime }} min read</span>
            </div>
            <div class="flex flex-wrap gap-2">
                {{ range .Params.tags }}
                <span class="px-2 py-1 bg-primary/10 text-secondary text-xs rounded-full">
                    {{ . }}
                </span>
                {{ end }}
            </div>
        </header>
        
        {{ .Content }}
        
        <footer class="mt-12 pt-6 border-t border-border">
            <div class="flex items-center">
                <div class="mr-4">
                    <img src="/images/profile.jpg" alt="Amine" class="w-12 h-12 rounded-full">
                </div>
                <div></div>
                    <h3 class="font-semibold">Amine</h3>
                    <p class="text-gray-500 text-sm">Independent Software Engineer & SRE Consultant</p>
                </div>
            </div>
        </footer>
    </article>
</div>
{{ end }}
